<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Edudaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/resources/css/main.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Palet Sasirangan Kalimantan Selatan
                        kuning: {
                            general: '#F5A623',
                            light: '#FEF3DB',
                            dark: '#C47D0E'
                        },
                        merah: {
                            general: '#C0392B',
                            light: '#FDECEA',
                            dark: '#922B21'
                        },
                        hijau: {
                            general: '#27AE60',
                            light: '#E8F8F0',
                            dark: '#1E8449'
                        },
                        biru: {
                            general: '#2980B9',
                            light: '#EAF4FB',
                            dark: '#1A5276'
                        },
                        ungu: {
                            general: '#8E44AD',
                            light: '#F5EEF8',
                            dark: '#6C3483'
                        },
                        cokelat: {
                            general: '#6D4C41',
                            light: '#EFEBE9',
                            dark: '#4E342E'
                        },
                        krem: {
                            general: '#FFF8EE',
                            dark: '#F5E6CC'
                        },
                    },
                    fontFamily: {
                        nunito: ['Nunito', 'sans-serif'],
                        fredoka: ['Fredoka One', 'cursive'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>

<body class="sasirangan-bg">

    <!-- ============================================================ -->
    <!-- 2. LOGIN GURU                                                -->
    <!-- ============================================================ -->
    <div id="login-guru" class="page active">
        <div class="min-h-screen flex">
            <div class="hidden lg:flex flex-col justify-center items-center w-1/2 p-12 relative"
                style="background:linear-gradient(135deg,#27AE60,#2980B9)">
                <div class="bubble-dec w-56 h-56 bg-white top-0 right-0"></div>
                <div class="bubble-dec w-32 h-32 bg-kuning-DEFAULT bottom-12 left-8"></div>
                <div class="relative z-10 text-center">
                    <div class="float-anim inline-block mb-6">
                        <div
                            class="w-32 h-32 bg-white/20 rounded-full flex items-center justify-center text-7xl shadow-2xl">
                            👨‍🏫</div>
                    </div>
                    <h1 class="font-fredoka text-4xl text-white mb-3">Portal Guru</h1>
                    <p class="text-white/80 font-600">Kelola kelas & pantau perkembangan<br>murid-muridmu</p>
                    <div class="motif-strip rounded-full mt-8 w-40 mx-auto opacity-60"></div>
                </div>
            </div>
            <div class="flex-1 flex flex-col justify-center items-center p-8">
                <div class="w-full max-w-md">
                    <div class="motif-strip rounded-t-2xl"></div>
                    <div class="bg-white rounded-b-2xl shadow-xl p-8">
                        <div class="text-center mb-8">
                            <span class="text-5xl">🏫</span>
                            <h2 class="font-fredoka text-3xl text-hijau-dark mt-2">Masuk sebagai Guru</h2>
                            <p class="text-gray-500 text-sm mt-1">Selamat datang, Bapak/Ibu Guru!</p>
                        </div>

                        <!-- Flash Message Section -->
                        {% include 'partials/flash_message.html' %}

                        <div class="space-y-4">
                            <form action="/login/teacher" method="POST" class="space-y-6">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <div>
                                    <label class="block text-sm font-700 text-cokelat-DEFAULT mb-1">Username</label>
                                    <input type="text" placeholder="Masukkan Username" id="username" name="username"
                                        required
                                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 font-nunito text-base focus:border-kuning-DEFAULT transition">
                                </div>
                                <div>
                                    <label class="block text-sm font-700 text-cokelat-general mb-1">Password</label>
                                    <input type="password" placeholder="Password" id="password" name="password" required
                                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 font-nunito text-base focus:border-kuning-general transition">
                                </div>
                                <button onclick="showPage('home')"
                                    class="w-full bg-kuning-general hover:bg-kuning-dark text-white font-800 py-3 rounded-xl text-lg shadow-md transition hover:-translate-y-0.5 active:translate-y-0">
                                    🔑 Masuk
                                </button>
                            </form>
                        </div>
                        <div class="mt-6 flex gap-2 justify-center">
                            <a href="/login"
                                class="text-sm text-kuning-general hover:underline font-600">Login Siswa</a>
                            <span class="text-gray-300">|</span>
                            <a href="/login/admin"
                                class="text-sm text-merah-general hover:underline font-600">Login Admin</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/resources/js/flash_message.js"></script>

</body>

</html>
