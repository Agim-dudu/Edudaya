<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Edudaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/resources/css/main.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Palet Sasirangan Kalimantan Selatan
                        kuning: {
                            general: '#F5A623',
                            light: '#FEF3DB',
                            dark: '#C47D0E'
                        },
                        merah: {
                            general: '#C0392B',
                            light: '#FDECEA',
                            dark: '#922B21'
                        },
                        hijau: {
                            general: '#27AE60',
                            light: '#E8F8F0',
                            dark: '#1E8449'
                        },
                        biru: {
                            general: '#2980B9',
                            light: '#EAF4FB',
                            dark: '#1A5276'
                        },
                        ungu: {
                            general: '#8E44AD',
                            light: '#F5EEF8',
                            dark: '#6C3483'
                        },
                        cokelat: {
                            general: '#6D4C41',
                            light: '#EFEBE9',
                            dark: '#4E342E'
                        },
                        krem: {
                            general: '#FFF8EE',
                            dark: '#F5E6CC'
                        },
                    },
                    fontFamily: {
                        nunito: ['Nunito', 'sans-serif'],
                        fredoka: ['Fredoka One', 'cursive'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>

<body class="sasirangan-bg">
    <!-- ============================================================ -->
    <!-- 4. REGISTER SISWA                                           -->
    <!-- ============================================================ -->
    <div id="register" class="page active">
        <div class="min-h-screen flex">
            <div class="hidden lg:flex flex-col justify-center items-center w-5/12 sasirangan-header p-12 relative">
                <div class="relative z-10 text-center">
                    <div class="wiggle-anim inline-block mb-4 text-8xl">✏️</div>
                    <h1 class="font-fredoka text-4xl text-white mb-2">Daftar Sekarang!</h1>
                    <p class="text-white/80 text-base">Bergabunglah dan mulai perjalanan<br>belajar numerasimu!</p>
                    <div class="mt-8 grid grid-cols-3 gap-3">
                        <div class="bg-white/20 rounded-xl p-3 text-center text-white">
                            <div class="text-2xl mb-1">🎯</div>
                            <div class="text-xs">Materi Seru</div>
                        </div>
                        <div class="bg-white/20 rounded-xl p-3 text-center text-white">
                            <div class="text-2xl mb-1">🏆</div>
                            <div class="text-xs">Raih Nilai</div>
                        </div>
                        <div class="bg-white/20 rounded-xl p-3 text-center text-white">
                            <div class="text-2xl mb-1">🌺</div>
                            <div class="text-xs">Budaya Kalsel</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex-1 flex flex-col justify-center items-center p-8">
                <div class="w-full max-w-lg">
                    <div class="motif-strip rounded-t-2xl"></div>
                    <div class="bg-white rounded-b-2xl shadow-xl p-8">
                        <h2 class="font-fredoka text-2xl text-amber-900 mb-6 text-center">📝 Formulir Pendaftaran
                            Siswa</h2>

                        <!-- Flash Message Section -->
                        {% include 'partials/flash_message.html' %}
                        
                        <form action="/register" method="POST" class="space-y-6">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="grid grid-cols-2 gap-4">
                                <div class="col-span-2">
                                    <label class="block text-sm font-700 text-cokelat-general mb-1">Nama Lengkap</label>
                                    <input type="text" placeholder="Nama lengkap sesuai rapor" id="full_name"
                                        name="full_name" required
                                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 font-nunito text-sm transition">
                                </div>
                                <div>
                                    <label class="block text-sm font-700 text-cokelat-general mb-1">Username</label>
                                    <input type="text" placeholder="Username" id="username" name="username" required
                                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 font-nunito text-sm transition">
                                </div>
                                <div>
                                    <label class="block text-sm font-700 text-cokelat-general mb-1">Jenis
                                        Kelamin</label>
                                    <select id="gender" name="gender"
                                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 font-nunito text-sm transition bg-white">
                                        <option value="L">Laki-laki</option>
                                        <option value="P">Perempuan</option>
                                    </select>
                                </div>
                                <div class="col-span-2">
                                    <label class="block text-sm font-700 text-cokelat-general mb-1">Token Kelas</label>
                                    <input type="text" placeholder="Dari gurumu" id="token" name="token" required
                                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 font-nunito text-sm transition tracking-widest">
                                </div>
                                <div class="col-span-2">
                                    <label class="block text-sm font-700 text-cokelat-general mb-1">Kata Sandi</label>
                                    <input type="password" placeholder="Min. 6 karakter" id="password" name="password"
                                        required
                                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 font-nunito text-sm transition">
                                </div>
                                <div class="col-span-2">
                                    <label class="block text-sm font-700 text-cokelat-general mb-1">Ulangi Kata
                                        Sandi</label>
                                    <input type="password" placeholder="Masukkan Ulang Kata Sandi" id="confirm_password"
                                        name="confirm_password" required
                                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 font-nunito text-sm transition">
                                </div>
                                <div class="col-span-2">
                                    <button
                                        class="w-full bg-yellow-500 hover:bg-kuning-dark text-white font-800 py-3 rounded-xl text-lg shadow-md transition hover:-translate-y-0.5">
                                        🎉 Daftar Sekarang!
                                    </button>
                                </div>
                            </div>
                        </form>
                        <p class="text-center text-sm text-gray-500 mt-4">Sudah punya akun? <a href="/login"
                                class="text-kuning-dark font-700 hover:underline">Masuk di sini</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/resources/js/flash_message.js"></script>

</body>

</html>
