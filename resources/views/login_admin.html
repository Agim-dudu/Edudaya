<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Edudaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Palet Sasirangan Kalimantan Selatan
                        kuning: {
                            DEFAULT: '#F5A623',
                            light: '#FEF3DB',
                            dark: '#C47D0E'
                        },
                        merah: {
                            DEFAULT: '#C0392B',
                            light: '#FDECEA',
                            dark: '#922B21'
                        },
                        hijau: {
                            DEFAULT: '#27AE60',
                            light: '#E8F8F0',
                            dark: '#1E8449'
                        },
                        biru: {
                            DEFAULT: '#2980B9',
                            light: '#EAF4FB',
                            dark: '#1A5276'
                        },
                        ungu: {
                            DEFAULT: '#8E44AD',
                            light: '#F5EEF8',
                            dark: '#6C3483'
                        },
                        cokelat: {
                            DEFAULT: '#6D4C41',
                            light: '#EFEBE9',
                            dark: '#4E342E'
                        },
                        krem: {
                            DEFAULT: '#FFF8EE',
                            dark: '#F5E6CC'
                        },
                    },
                    fontFamily: {
                        nunito: ['Nunito', 'sans-serif'],
                        fredoka: ['Fredoka One', 'cursive'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* ===== GLOBAL ===== */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: #FFF8EE;
        }

        .page {
            display: none;
            min-height: 100vh;
        }

        .page.active {
            display: block;
        }

        /* ===== SASIRANGAN PATTERN ===== */
        .sasirangan-bg {
            background-color: #FFF8EE;
            background-image:
                repeating-linear-gradient(45deg, rgba(245, 166, 35, 0.08) 0px, rgba(245, 166, 35, 0.08) 2px, transparent 2px, transparent 20px),
                repeating-linear-gradient(-45deg, rgba(192, 57, 43, 0.06) 0px, rgba(192, 57, 43, 0.06) 2px, transparent 2px, transparent 20px);
        }

        .sasirangan-header {
            background: linear-gradient(135deg, #C0392B 0%, #8E44AD 50%, #2980B9 100%);
            position: relative;
            overflow: hidden;
        }

        .sasirangan-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.05) 0, rgba(255, 255, 255, 0.05) 2px, transparent 2px, transparent 16px),
                repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.05) 0, rgba(255, 255, 255, 0.05) 2px, transparent 2px, transparent 16px);
        }

        .motif-border {
            border-image: repeating-linear-gradient(90deg, #C0392B, #F5A623 20px, #27AE60 40px, #2980B9 60px, #8E44AD 80px, #C0392B 100px) 4;
            border-style: solid;
            border-width: 4px;
        }

        .motif-strip {
            height: 8px;
            background: repeating-linear-gradient(90deg, #C0392B 0px, #C0392B 16px, #F5A623 16px, #F5A623 32px, #27AE60 32px, #27AE60 48px, #2980B9 48px, #2980B9 64px, #8E44AD 64px, #8E44AD 80px);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            min-height: 100vh;
        }

        .sidebar-link {
            transition: all 0.2s;
        }

        .sidebar-link:hover {
            transform: translateX(4px);
        }

        .sidebar-link.active {
            background: rgba(255, 255, 255, 0.2);
            border-left: 4px solid #F5A623;
        }

        /* ===== CARDS ===== */
        .card-hover {
            transition: all 0.25s;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        /* ===== BUBBLES DECORATION ===== */
        .bubble-dec {
            position: absolute;
            border-radius: 50%;
            opacity: 0.12;
            pointer-events: none;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-10px)
            }
        }

        @keyframes wiggle {

            0%,
            100% {
                transform: rotate(-3deg)
            }

            50% {
                transform: rotate(3deg)
            }
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(245, 166, 35, 0.5)
            }

            100% {
                box-shadow: 0 0 0 16px rgba(245, 166, 35, 0)
            }
        }

        .float-anim {
            animation: float 3s ease-in-out infinite;
        }

        .wiggle-anim {
            animation: wiggle 2s ease-in-out infinite;
        }

        .pulse-anim {
            animation: pulse-ring 1.5s ease-out infinite;
        }

        /* ===== DECODING GAME ===== */
        .decode-card {
            perspective: 600px;
        }

        .decode-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
        }

        .decode-card.flipped .decode-inner {
            transform: rotateY(180deg);
        }

        .decode-front,
        .decode-back {
            backface-visibility: hidden;
            position: absolute;
            inset: 0;
        }

        .decode-back {
            transform: rotateY(180deg);
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            height: 14px;
            border-radius: 99px;
            overflow: hidden;
            background: #E5E7EB;
        }

        .progress-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, #27AE60, #F5A623);
            transition: width 0.5s ease;
        }

        /* ===== QUIZ ===== */
        .quiz-option {
            transition: all 0.2s;
            cursor: pointer;
        }

        .quiz-option:hover {
            transform: scale(1.02);
        }

        .quiz-option.correct {
            background: #E8F8F0 !important;
            border-color: #27AE60 !important;
        }

        .quiz-option.wrong {
            background: #FDECEA !important;
            border-color: #C0392B !important;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #C0392B;
            border-radius: 99px;
        }

        ::-webkit-scrollbar-track {
            background: #FFF8EE;
        }

        /* nav tab */
        .tab-btn {
            transition: all 0.2s;
        }

        .tab-btn.active {
            border-bottom: 3px solid #C0392B;
            color: #C0392B;
            font-weight: 800;
        }

        /* input focus */
        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #F5A623;
            outline-offset: 2px;
        }

        /* badge */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
        }
    </style>
</head>

<body class="sasirangan-bg">

    <!-- ============================================================ -->
    <!-- 3. LOGIN SUPER ADMIN                                         -->
    <!-- ============================================================ -->
    <div id="login-admin" class="page active">
        <div class="min-h-screen flex items-center justify-center p-8"
            style="background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)">
            <div class="w-full max-w-md">
                <!-- top motif strip -->
                <div class="motif-strip rounded-t-2xl"></div>
                <div class="bg-white/10 backdrop-blur border border-white/20 rounded-b-2xl p-8 text-white">
                    <div class="text-center mb-8">
                        <div
                            class="w-20 h-20 bg-merah-DEFAULT/20 border-2 border-merah-DEFAULT rounded-2xl flex items-center justify-center text-5xl mx-auto mb-3">
                            🛡️</div>
                        <h2 class="font-fredoka text-3xl">Super Admin</h2>
                        <p class="text-white/60 text-sm mt-1">Akses Sistem Edudaya.id</p>
                    </div>
                    <!-- Flash Message Section -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                    <div id="flash-messages" class="mb-4 space-y-2 transition duration-300">
                        {% for category, message in messages %}
                        <div
                            class="text-white px-4 py-2 rounded-lg shadow-md animate-pulse {% if category == 'success' %}bg-green-500{% elif category == 'danger' %}bg-red-500{% else %}bg-gray-500{% endif %}">
                            {{ message }}
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    {% endwith %}
                    <div class="space-y-4">
                        <form action="/login_admin" method="POST" class="space-y-6">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div>
                                <label class="block text-sm font-700 text-white/80 mb-1">Username Admin</label>
                                <input type="text" placeholder="superadmin" id="username" name="username" required
                                    class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-white/40 font-nunito">
                            </div>
                            <div>
                                <label class="block text-sm font-700 text-white/80 mb-1">Kata Sandi</label>
                                <input type="password" placeholder="••••••••" id="password" name="password" required
                                    class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-white/40 font-nunito">
                            </div>
                            <button
                                class="w-full bg-red-500 hover:bg-merah-dark text-white font-800 py-3 rounded-xl text-lg shadow-lg transition hover:-translate-y-0.5">
                                🔐 Masuk ke Sistem
                            </button>
                        </form>
                    </div>
                </div>
                <p class="text-center text-white/30 text-xs mt-4">Edudaya.id v1.0 — Akses terbatas, hanya untuk
                    administrator</p>
            </div>
        </div>
    </div>

    <script>
        // Tunggu sampai halaman selesai dimuat
        document.addEventListener('DOMContentLoaded', function () {
            const flashContainer = document.getElementById('flash-messages');

            if (flashContainer) {
                // Setel waktu tunggu (misal: 3000ms = 3 detik)
                setTimeout(function () {
                    // Tambahkan efek transisi halus (opacity 0)
                    flashContainer.style.transition = "opacity 0.6s ease";
                    flashContainer.style.opacity = "0";

                    // Hapus elemen sepenuhnya dari layout setelah transisi selesai
                    setTimeout(function () {
                        flashContainer.remove();
                    }, 600);
                }, 3000);
            }
        });
    </script>

</body>

</html>
