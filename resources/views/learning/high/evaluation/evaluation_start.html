<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Evaluasi Edudaya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --sidebar-w: 260px;
      --navbar-h: 60px;

      /* Green Soft Palette */
      --green-50:  #f0faf4;
      --green-100: #d6f5e3;
      --green-200: #a8e9c4;
      --green-300: #6dd6a0;
      --green-400: #38bf7a;
      --green-500: #22a663;
      --green-600: #178a50;
      --green-700: #0f6e3e;
      --green-800: #0a522e;
      --green-900: #063620;

      --surface:   #f4faf7;
      --white:     #ffffff;
      --border:    #c8ead8;
      --border-light: #e4f4ed;
    }

    * { font-family: 'Nunito', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    .brand { font-family: 'Fredoka One', cursive; }
    body { background: var(--surface); min-height: 100vh; overflow-x: hidden; }

    /* ── Navbar ── */
    #navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--navbar-h);
      background: var(--white);
      border-bottom: 2px solid var(--border-light);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 12px rgba(22,138,80,0.08);
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }

    /* ── Burger Button ── */
    .burger-btn {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--green-50); border: 2px solid var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      cursor: pointer; transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0; position: relative; overflow: hidden;
    }
    .burger-btn:hover { background: var(--green-100); border-color: var(--green-400); }
    .burger-btn span {
      display: block; width: 18px; height: 2px;
      background: var(--green-600); border-radius: 2px;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1), opacity 0.3s;
      transform-origin: center;
    }
    /* Burger → X: triggered via JS class 'open' */
    .burger-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .burger-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .burger-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* ── Logo ── */
    .site-logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--green-500), var(--green-300));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 900; color: white;
      font-family: 'Fredoka One', cursive;
      box-shadow: 0 3px 10px rgba(22,138,80,0.28);
    }
    .logo-title { font-size: 20px; color: var(--green-700); font-family: 'Fredoka One', cursive; }
    .logo-sub   { font-size: 10px; font-weight: 700; color: var(--green-400); letter-spacing: 0.05em; }

    /* ── Timer ── */
    .timer-box {
      display: flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #fef9ec, #fef3c7);
      border: 2px solid #fbbf24; border-radius: 999px;
      padding: 6px 18px; font-weight: 800; font-size: 17px; color: #92400e;
      box-shadow: 0 3px 10px rgba(251,191,36,0.22);
    }
    .timer-box.urgent {
      background: linear-gradient(135deg,#fee2e2,#fca5a5);
      border-color: #f87171; color: #7f1d1d;
      animation: timerPulse 0.7s ease-in-out infinite;
    }
    @keyframes timerPulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.04);} }

    /* ── Layout ── */
    #layout {
      display: flex;
      margin-top: var(--navbar-h);
      min-height: calc(100vh - var(--navbar-h));
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--white);
      border-right: 2px solid var(--border-light);
      position: fixed;
      top: var(--navbar-h); left: 0; bottom: 0;
      overflow-y: auto;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      z-index: 50;
      padding: 24px 16px;
    }
    /* Default: sidebar VISIBLE (not collapsed) */
    #sidebar.collapsed { transform: translateX(calc(-1 * var(--sidebar-w))); }

    /* Overlay (mobile + when sidebar open on mobile) */
    #sidebarOverlay {
      display: none;
      position: fixed; inset: 0; top: var(--navbar-h);
      background: rgba(0,0,0,0.22); z-index: 40;
    }
    #sidebarOverlay.show { display: block; }

    .sidebar-section-title {
      font-size: 11px; font-weight: 800; color: var(--green-500);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px;
    }

    /* Sidebar progress */
    .sb-progress-wrap { margin-bottom: 20px; }
    .sb-progress-label {
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 800; color: #6b7280; margin-bottom: 6px;
    }
    .sb-progress-bar {
      background: var(--green-100); border-radius: 999px; height: 8px; overflow: hidden;
    }
    .sb-progress-fill {
      background: linear-gradient(90deg, var(--green-600), var(--green-400));
      height: 100%; border-radius: 999px;
      transition: width 0.5s cubic-bezier(.34,1.56,.64,1);
    }

    /* Nav number grid */
    .nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .nav-num {
      aspect-ratio: 1; border-radius: 12px;
      font-weight: 800; font-size: 13px;
      border: 2px solid #e5e7eb;
      background: white; color: #9ca3af;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(.34,1.56,.64,1);
      display: flex; align-items: center; justify-content: center;
    }
    .nav-num:hover:not(.active) { transform: scale(1.1); border-color: var(--green-400); color: var(--green-600); }
    .nav-num.active   { background: var(--green-600); color: white; border-color: var(--green-700); box-shadow: 0 4px 12px rgba(22,138,80,0.35); }
    .nav-num.answered { background: var(--green-100); color: var(--green-700); border-color: var(--green-300); }

    /* Sidebar submit */
    .sb-submit-btn {
      width: 100%; padding: 12px; border-radius: 14px; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--green-600), var(--green-400));
      color: white; font-weight: 800; font-size: 14px;
      box-shadow: 0 4px 14px rgba(22,138,80,0.28);
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .sb-submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(22,138,80,0.38); }
    .sb-submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .sb-submit-hint { font-size: 11px; font-weight: 700; color: var(--green-400); text-align: center; margin-top: 8px; }

    /* ── Main ── */
    #main {
      flex: 1;
      margin-left: var(--sidebar-w);
      transition: margin-left 0.3s cubic-bezier(.4,0,.2,1);
      padding: 32px 40px;
      display: flex; flex-direction: column;
      min-height: calc(100vh - var(--navbar-h));
    }
    #main.expanded { margin-left: 0; }

    /* Question card */
    .q-card {
      background: var(--white); border-radius: 20px;
      border: 2px solid var(--border-light);
      box-shadow: 0 4px 24px rgba(22,138,80,0.07);
      padding: 32px 36px; flex: 1;
    }

    /* Meta row */
    .q-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .q-number-badge {
      background: var(--green-50); color: var(--green-700); border: 2px solid var(--green-200);
      border-radius: 999px; padding: 4px 14px; font-size: 12px; font-weight: 800;
    }
    .q-topic-badge {
      background: var(--green-100); color: var(--green-800);
      border: 2px solid var(--green-300);
      border-radius: 999px; padding: 4px 14px; font-size: 12px; font-weight: 800;
    }

    /* Progress bar in card */
    .q-progress { background: var(--green-100); border-radius: 999px; height: 6px; margin-bottom: 24px; overflow: hidden; }
    .q-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green-600), var(--green-400));
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(.34,1.56,.64,1);
    }

    .q-divider { height: 1px; background: var(--border-light); margin: 0 -36px 24px; }

    /* Question text */
    .q-text-wrap { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 28px; }
    .q-text { font-size: 18px; font-weight: 800; color: #1f2937; line-height: 1.55; }

    /* Options */
    .options-list { display: flex; flex-direction: column; gap: 12px; }
    .opt-label {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 20px; border-radius: 14px;
      border: 2px solid var(--border-light); background: white;
      cursor: pointer; user-select: none;
      transition: all 0.22s cubic-bezier(.34,1.56,.64,1);
    }
    .opt-label:hover {
      border-color: var(--green-300); background: var(--green-50);
      transform: translateX(4px);
      box-shadow: 0 4px 16px rgba(22,138,80,0.13);
    }
    .opt-label.selected {
      border-color: var(--green-500);
      background: linear-gradient(135deg, var(--green-50), var(--green-100));
      transform: translateX(4px);
      box-shadow: 0 6px 20px rgba(22,138,80,0.18);
    }
    input[type="radio"] { display: none; }
    .opt-radio {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid var(--green-300); background: white; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .opt-label.selected .opt-radio { background: var(--green-500); border-color: var(--green-600); }
    .opt-radio-dot {
      width: 8px; height: 8px; border-radius: 50%; background: white;
      transform: scale(0); transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
    }
    .opt-label.selected .opt-radio-dot { transform: scale(1); }
    .opt-letter {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 12px;
      background: var(--green-50); color: var(--green-600); border: 2px solid var(--green-200);
      transition: all 0.2s;
    }
    .opt-label.selected .opt-letter { background: var(--green-600); color: white; border-color: var(--green-700); }
    .opt-text { font-weight: 700; font-size: 15px; color: #374151; line-height: 1.4; }
    .opt-label.selected .opt-text { color: var(--green-900); }

    /* Footer nav */
    .q-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 28px; padding-top: 20px;
      border-top: 2px dashed var(--border-light);
    }
    .hint-text { font-size: 13px; font-weight: 700; color: #9ca3af; }

    .btn-nav {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 22px; border-radius: 12px;
      font-weight: 800; font-size: 14px; cursor: pointer;
      transition: all 0.2s cubic-bezier(.34,1.56,.64,1); border: none;
    }
    .btn-prev { background: var(--green-50); color: var(--green-700); border: 2px solid var(--green-200); }
    .btn-prev:hover { background: var(--green-100); transform: translateX(-3px); }
    .btn-next { background: linear-gradient(135deg, var(--green-600), var(--green-400)); color: white; box-shadow: 0 4px 14px rgba(22,138,80,0.32); }
    .btn-next:hover { transform: translateX(3px); box-shadow: 0 6px 20px rgba(22,138,80,0.42); }
    .btn-submit-main { background: linear-gradient(135deg, var(--green-700), var(--green-500)); color: white; box-shadow: 0 4px 14px rgba(22,138,80,0.32); }
    .btn-submit-main:hover { transform: translateX(3px); box-shadow: 0 6px 20px rgba(22,138,80,0.42); }
    .btn-nav:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

    /* Warn strip */
    .warn-strip {
      display: flex; align-items: center; gap: 10px;
      background: #fef3c7; border: 2px solid #fbbf24; border-radius: 12px;
      padding: 10px 16px; font-weight: 700; font-size: 13px; color: #92400e;
      margin-top: 12px;
    }

    /* ── Result overlay ── */
    #resultOverlay {
      display: none;
      position: fixed; inset: 0; top: var(--navbar-h);
      background: rgba(240,250,244,0.97);
      z-index: 200;
      overflow-y: auto;
      padding: 40px 20px;
      align-items: flex-start; justify-content: center;
    }
    #resultOverlay.show { display: flex; }
    .result-card {
      background: white; border-radius: 24px; width: 100%; max-width: 680px;
      border: 2px solid var(--border-light);
      box-shadow: 0 16px 56px rgba(22,138,80,0.1);
      padding: 36px;
    }

    /* JSON box */
    .json-box {
      background: #0f172a; color: #e2e8f0;
      border-radius: 14px; padding: 18px 22px;
      font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.8;
      overflow: auto; max-height: 380px;
      border: 2px solid #1e3a5f;
    }
    .json-box::-webkit-scrollbar { width:5px; height:5px; }
    .json-box::-webkit-scrollbar-track { background:#1e293b; border-radius:3px; }
    .json-box::-webkit-scrollbar-thumb { background:#475569; border-radius:3px; }
    .j-key  { color: #93c5fd; }
    .j-str  { color: #86efac; }
    .j-num  { color: #fde68a; }
    .j-bool { color: #c084fc; }
    .j-null { color: #94a3b8; }

    .status-sending { background:#fef3c7; color:#92400e; border:2px solid #fbbf24; }
    .status-success { background:#dcfce7; color:#15803d; border:2px solid #86efac; }
    .status-error   { background:#fee2e2; color:#b91c1c; border:2px solid #fca5a5; }

    .btn-action {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 24px; border-radius: 12px;
      font-weight: 800; font-size: 14px; cursor: pointer; border: none;
      transition: all 0.2s;
    }
    .btn-green { background: linear-gradient(135deg, var(--green-600), var(--green-400)); color: white; box-shadow: 0 4px 14px rgba(22,138,80,0.28); }
    .btn-ghost { background: var(--green-50); color: var(--green-700); border: 2px solid var(--green-200); }
    .btn-action:hover { transform: translateY(-2px); }

    /* Confetti */
    .confetti-piece {
      position: fixed; top: -20px; animation: confettiFall linear forwards; border-radius: 2px;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      /* On mobile: sidebar hidden by default, overlay toggles it */
      #sidebar { transform: translateX(calc(-1 * var(--sidebar-w))); }
      #sidebar.mobile-open { transform: translateX(0); }
      #main { margin-left: 0 !important; padding: 20px 16px; }
      .q-card { padding: 22px 20px; }
      .q-divider { margin: 0 -20px 20px; }
    }
  </style>
</head>
<body>

  <!-- ── Navbar ── -->
  <nav id="navbar">
    <div class="nav-left">
      <button class="burger-btn" id="burgerBtn" aria-label="Buka/tutup panel soal" aria-expanded="true">
        <span></span><span></span><span></span>
      </button>
      <div class="site-logo">
        <div>
          <div class="logo-title">Edudaya</div>
          <div class="logo-sub">Evaluasi</div>
        </div>
      </div>
    </div>
    <div class="timer-box" id="timerBox">⏰ <span id="timerText">15:00</span></div>
  </nav>

  <!-- ── Layout ── -->
  <div id="layout">

    <!-- Overlay (mobile) -->
    <div id="sidebarOverlay"></div>

    <!-- ── Sidebar ── -->
    <aside id="sidebar">
      <div class="sidebar-section-title">Progress</div>
      <div class="sb-progress-wrap">
        <div class="sb-progress-label">
          <span>Terjawab</span>
          <span id="sbProgressText">0 / 10</span>
        </div>
        <div class="sb-progress-bar">
          <div class="sb-progress-fill" id="sbProgressFill" style="width:0%"></div>
        </div>
      </div>

      <div class="sidebar-section-title">Nomor Soal</div>
      <div class="nav-grid" id="navGrid"></div>

      <div style="margin-top:8px">
        <button class="sb-submit-btn" id="sbSubmitBtn" disabled onclick="handleSubmit()">
          🚀 Kirim Jawaban
        </button>
        <p class="sb-submit-hint" id="sbSubmitHint">Jawab semua soal dulu!</p>
      </div>
    </aside>

    <!-- ── Main ── -->
    <main id="main">
      <div class="q-card" id="quizCard">

        <div class="q-meta">
          <span class="q-number-badge">Soal <span id="qNum">1</span> dari <span id="qOf">10</span></span>
          <span class="q-topic-badge" id="qTopic">Topik</span>
        </div>

        <div class="q-progress" style="margin-top:10px;margin-bottom:20px">
          <div class="q-progress-fill" id="qProgressFill" style="width:10%"></div>
        </div>

        <div class="q-divider"></div>

        <div class="q-text-wrap">
          <div class="q-text" id="qText"></div>
        </div>

        <div class="options-list" id="optionsList"></div>

        <div class="q-footer">
          <button class="btn-nav btn-prev" id="btnPrev" onclick="goTo(currentQ-1)">← Sebelumnya</button>
          <button class="btn-nav btn-next"        id="btnNext"   onclick="goTo(currentQ+1)">Selanjutnya →</button>
          <button class="btn-nav btn-submit-main" id="btnSubmit" onclick="handleSubmit()" style="display:none">🚀 Kirim →</button>
        </div>

        <div class="warn-strip" id="warnStrip" style="display:none">
          ⚠️ <span id="warnText">Masih ada soal yang belum dijawab!</span>
        </div>

      </div>
    </main>
  </div>

  <!-- ── Result overlay ── -->
  <div id="resultOverlay">
    <div class="result-card" id="resultCard"></div>
  </div>

  <script>
    /* ── Sidebar toggle (fixed logic) ── */
    (function () {
      const sidebar  = document.getElementById('sidebar');
      const overlay  = document.getElementById('sidebarOverlay');
      const burgerBtn = document.getElementById('burgerBtn');
      const main     = document.getElementById('main');
      const MOBILE_BP = 768;

      function isMobile() { return window.innerWidth <= MOBILE_BP; }

      /* State: track whether sidebar is "open" */
      let sidebarOpen = true; /* default open on desktop */

      function applyState() {
        if (isMobile()) {
          /* Mobile: sidebar slides in from left over content */
          sidebar.classList.toggle('mobile-open', sidebarOpen);
          sidebar.classList.remove('collapsed');
          overlay.classList.toggle('show', sidebarOpen);
          main.style.marginLeft = ''; /* always 0 on mobile via CSS */
          burgerBtn.setAttribute('aria-expanded', sidebarOpen);
        } else {
          /* Desktop: sidebar pushes content */
          sidebar.classList.remove('mobile-open');
          sidebar.classList.toggle('collapsed', !sidebarOpen);
          overlay.classList.remove('show');
          main.classList.toggle('expanded', !sidebarOpen);
          burgerBtn.setAttribute('aria-expanded', sidebarOpen);
        }
        /* Burger icon X ↔ hamburger */
        burgerBtn.classList.toggle('open', !sidebarOpen);
      }

      window.toggleSidebar = function () {
        sidebarOpen = !sidebarOpen;
        applyState();
      };

      /* Close sidebar when clicking overlay */
      overlay.addEventListener('click', function () {
        sidebarOpen = false;
        applyState();
      });

      burgerBtn.addEventListener('click', window.toggleSidebar);

      /* Re-evaluate on resize */
      window.addEventListener('resize', function () {
        if (!isMobile()) {
          /* Reset mobile class on desktop */
          sidebar.classList.remove('mobile-open');
          overlay.classList.remove('show');
          main.style.marginLeft = '';
        }
        applyState();
      });

      /* Init */
      if (isMobile()) sidebarOpen = false;
      applyState();
    })();
  </script>

  <script>
    window.APP_CONFIG = {
        userId:    "{{ user_id }}",
        csrfToken: "{{ csrf_token() }}",
        questions: {{ questions | tojson }},
        pretestApiUrl: "/evaluation/submit/{{ user_id }}"
    };
  </script>
  <script src="/resources/js/pretest_question_handle.js"></script>
  <script src="/resources/js/pretest.js"></script>
</body>
</html>
